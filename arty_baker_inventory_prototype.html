<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arty baker 在庫管理 試作品</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ef;color:#292622}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{padding:20px 18px 14px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:5}
.logo{font-weight:800;font-size:22px}.sub{font-size:12px;color:#888;margin-top:3px}
select,input,button{font:inherit}select,input{border:1px solid #ddd;border-radius:12px;padding:11px;background:#fff;width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}.content{padding:16px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px}.tab{border:0;background:#f1eee9;padding:9px 13px;border-radius:999px;white-space:nowrap}.tab.active{background:#292622;color:#fff}
.alert{background:#fff3e8;border:1px solid #f0d5ba;border-radius:14px;padding:12px 13px;margin-bottom:14px}.alert b{display:block;margin-bottom:3px}
.search{margin-bottom:12px}.card{border:1px solid #eee;border-radius:16px;padding:13px;margin:9px 0}.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-weight:700}.meta{font-size:12px;color:#888;margin-top:4px}.stock{font-weight:800;font-size:18px}.badge{font-size:11px;padding:4px 7px;border-radius:999px}.ok{background:#e9f6ed;color:#26723b}.low{background:#fff5cf;color:#846600}.out{background:#ffe8e5;color:#a32f24}
.controls{display:flex;gap:7px;margin-top:10px}.controls button,.primary{border:0;border-radius:11px;padding:9px 12px;background:#f0ece7}.controls .minus{min-width:48px}.controls .plus{min-width:48px}.primary{background:#292622;color:white;width:100%;margin-top:10px}
.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #eee;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav{border:0;background:white;padding:8px 2px;font-size:11px;color:#777}.nav.active{color:#111;font-weight:700}
.panel{display:none}.panel.show{display:block}.title{font-size:19px;font-weight:800;margin:6px 0 14px}.history{font-size:13px}.history div{padding:11px 0;border-bottom:1px solid #eee}.muted{color:#888;font-size:12px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:white;width:100%;max-width:520px;margin:auto;padding:20px;border-radius:22px 22px 0 0}.sheet h3{margin-top:0}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}
@media(min-width:600px){.app{margin-top:20px;border-radius:20px;box-shadow:0 10px 40px #0001;overflow:hidden}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">🥐 Arty baker</div>
  <div class="sub">材料・備品 在庫管理</div>
  <div class="row" style="margin-top:12px">
    <select id="store"><option>渋谷店</option><option>新宿店</option><option>吉祥寺店</option></select>
    <select id="staff"><option>山田</option><option>佐藤</option><option>鈴木</option><option>田中</option></select>
  </div>
</header>

<main class="content">
<section id="inventory" class="panel show">
  <div class="tabs"><button class="tab active" onclick="filterCat('all',this)">すべて</button><button class="tab" onclick="filterCat('材料',this)">材料</button><button class="tab" onclick="filterCat('備品',this)">備品</button><button class="tab" onclick="filterCat('発注',this)">🔴 発注</button></div>
  <div class="alert"><b>🔴 発注が必要です</b><span id="alertText">バター、紙袋（大）など 2件</span></div>
  <input class="search" id="search" placeholder="🔎 商品を検索" oninput="render()">
  <div id="list"></div>
  <button class="primary" onclick="openAdd()">＋ 商品を追加</button>
</section>

<section id="orders" class="panel">
  <div class="title">📦 発注リスト</div>
  <div id="ordersList"></div>
</section>

<section id="history" class="panel">
  <div class="title">📋 操作履歴</div>
  <div class="history" id="historyList"></div>
</section>

<section id="more" class="panel">
  <div class="title">⚙️ その他</div>
  <div class="card"><b>スタッフ管理</b><div class="meta">名前を追加・変更できます</div><button class="primary" onclick="openStaff()">＋ スタッフを追加</button></div>
  <div class="card"><b>店舗間移動</b><div class="meta">在庫を別店舗へ移動する機能（試作）</div><button class="primary" onclick="alert('店舗間移動画面は次の開発で追加できます。')">🔄 移動を登録</button></div>
  <div class="card"><b>管理設定</b><div class="meta">発注ラインやカテゴリなど</div><button class="primary" onclick="alert('管理設定はPIN保護を付けて実装予定です。')">🔐 管理設定</button></div>
</section>
</main>

<nav class="bottom">
<button class="nav active" onclick="show('inventory',this)">📦<br>在庫</button>
<button class="nav" onclick="show('orders',this)">🛒<br>発注</button>
<button class="nav" onclick="show('history',this)">📋<br>履歴</button>
<button class="nav" onclick="show('more',this)">⚙️<br>その他</button>
</nav>
</div>

<div class="modal" id="modal"><div class="sheet">
<button class="close" onclick="closeModal()">×</button><h3 id="modalTitle">商品を追加</h3>
<div id="modalBody"></div>
</div></div>

<script>
let products=[
 {name:"強力粉",cat:"材料",unit:"kg",stock:18,min:10,order:25},
 {name:"薄力粉",cat:"材料",unit:"kg",stock:4,min:5,order:10},
 {name:"バター",cat:"材料",unit:"kg",stock:2.5,min:5,order:10},
 {name:"砂糖",cat:"材料",unit:"kg",stock:8,min:4,order:10},
 {name:"ドライイースト",cat:"材料",unit:"袋",stock:6,min:3,order:10},
 {name:"卵",cat:"材料",unit:"個",stock:24,min:20,order:60},
 {name:"紙袋（小）",cat:"備品",unit:"枚",stock:120,min:50,order:200},
 {name:"紙袋（大）",cat:"備品",unit:"枚",stock:18,min:30,order:100},
 {name:"ラップ",cat:"備品",unit:"本",stock:3,min:2,order:6}
];
let history=[
 "14:32　山田　バター　3.5kg → 2.5kg",
 "13:58　佐藤　紙袋（大）　28枚 → 18枚",
 "11:20　田中　強力粉　20kg → 18kg"
];
let cat='all';
function status(p){if(p.stock<=0)return ['out','売り切れ'];if(p.stock<=p.min)return ['out','発注'];if(p.stock<=p.min*1.5)return ['low','少ない'];return ['ok','OK']}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let arr=products.filter(p=>(cat==='all'||p.cat===cat||(cat==='発注'&&p.stock<=p.min))&&p.name.toLowerCase().includes(q));
 document.getElementById('list').innerHTML=arr.map((p,i)=>{let s=status(p);return `<div class="card"><div class="item"><div><div class="name">${p.name}</div><div class="meta">${p.cat} ・ 発注ライン ${p.min}${p.unit}</div></div><div style="text-align:right"><div class="stock">${p.stock}${p.unit}</div><span class="badge ${s[0]}">${s[1]}</span></div></div><div class="controls"><button class="minus" onclick="change('${p.name}',-1)">−1</button><button onclick="change('${p.name},'">数量入力</button><button class="plus" onclick="change('${p.name}',1)">＋1</button></div></div>`}).join('');
 renderOrders();
}
function change(name,delta){let p=products.find(x=>x.name===name);if(!p)return;let old=p.stock;p.stock=Math.max(0,Math.round((p.stock+delta)*10)/10);let staff=document.getElementById('staff').value;history.unshift(`${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}　${staff}　${name}　${old}${p.unit} → ${p.stock}${p.unit}`);render();renderHistory()}
function filterCat(x,el){cat=x;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function renderOrders(){let a=products.filter(p=>p.stock<=p.min);document.getElementById('ordersList').innerHTML=a.length?a.map(p=>`<div class="card"><div class="item"><div><b>${p.name}</b><div class="meta">現在 ${p.stock}${p.unit} / 発注ライン ${p.min}${p.unit}</div></div><button onclick="alert('${p.name} を ${p.order}${p.unit} 発注済みにしました（試作）')">発注済み</button></div></div>`).join(''):'<p class="muted">発注が必要な商品はありません。</p>'}
function renderHistory(){document.getElementById('historyList').innerHTML=history.map(x=>`<div>${x}</div>`).join('')}
function show(id,el){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderHistory();renderOrders()}
function openAdd(){document.getElementById('modalTitle').textContent='商品を追加';document.getElementById('modalBody').innerHTML=`<label>商品名<input id="n" placeholder="例：牛乳" style="margin:6px 0 12px"></label><label>カテゴリ<select id="c" style="margin:6px 0 12px"><option>材料</option><option>備品</option></select></label><label>単位<input id="u" placeholder="kg / 個 / 袋 / 本 など" style="margin:6px 0 12px"></label><div class="row"><label>現在庫<input id="s" type="number" value="0"></label><label>発注ライン<input id="m" type="number" value="5"></label></div><button class="primary" onclick="addProduct()">商品を追加</button>`;document.getElementById('modal').classList.add('show')}
function addProduct(){let n=document.getElementById('n').value.trim(),c=document.getElementById('c').value,u=document.getElementById('u').value.trim()||'個',s=Number(document.getElementById('s').value),m=Number(document.getElementById('m').value);if(!n)return alert('商品名を入力してください');products.push({name:n,cat:c,unit:u,stock:s,min:m,order:m*2});history.unshift(`商品追加　${document.getElementById('staff').value}　${n}`);closeModal();render();renderHistory()}
function openStaff(){document.getElementById('modalTitle').textContent='スタッフを追加';document.getElementById('modalBody').innerHTML=`<label>スタッフ名<input id="sn" placeholder="例：高橋" style="margin:6px 0 12px"></label><button class="primary" onclick="addStaff()">スタッフを追加</button>`;document.getElementById('modal').classList.add('show')}
function addStaff(){let n=document.getElementById('sn').value.trim();if(n){let o=document.createElement('option');o.textContent=n;document.getElementById('staff').appendChild(o);document.getElementById('staff').value=n}closeModal()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
render();renderHistory();
</script>
</body>
</html>
