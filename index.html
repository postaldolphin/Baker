<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arty baker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ef;color:#292622}.app{max-width:540px;margin:auto;min-height:100vh;background:white}.top{padding:20px 18px 14px;border-bottom:1px solid #eee;position:sticky;top:0;background:white;z-index:2}.logo{font-weight:800;font-size:23px}.sub,.meta{font-size:12px;color:#888}.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}select,input,textarea,button{font:inherit}select,input,textarea{border:1px solid #ddd;border-radius:12px;padding:11px;background:white;width:100%}textarea{min-height:90px}.content{padding:16px}.section{display:none}.section.show{display:block}.title{font-size:20px;font-weight:800;margin:5px 0 14px}.card,.notice{border:1px solid #eee;border-radius:16px;padding:13px;margin:9px 0}.notice.important{border-left:5px solid #d85c4d}.notice.normal{border-left:5px solid #d5a33a}.head,.item{display:flex;justify-content:space-between;gap:10px;align-items:center}.name,.notice-title{font-weight:700}.stock{font-weight:800;font-size:18px}.badge{font-size:11px;padding:4px 7px;border-radius:999px}.ok{background:#e9f6ed;color:#26723b}.low{background:#fff5cf;color:#846600}.out{background:#ffe8e5;color:#a32f24}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tab{border:0;background:#f1eee9;padding:9px 13px;border-radius:999px;white-space:nowrap}.tab.active{background:#292622;color:white}.controls{display:flex;gap:7px;margin-top:10px}.controls button,.primary{border:0;border-radius:11px;padding:10px 12px}.primary{background:#292622;color:white;width:100%;margin-top:10px}.bottom{position:sticky;bottom:0;background:white;border-top:1px solid #eee;padding:9px;display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:white;font-size:10px;color:#777;padding:7px 2px}.nav.active{color:#111;font-weight:700}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:5}.modal.show{display:flex}.sheet{background:white;width:100%;max-width:540px;margin:auto;padding:20px;border-radius:22px 22px 0 0}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}label{display:block;font-size:13px;font-weight:600;margin-top:10px}
</style>
<div class="app"><header class="top"><div class="logo">🥐 Arty baker</div><div class="sub">Ingredients & Supplies Inventory</div><div class="row"><select id="loc"><option>Sandymount</option><option>Dalkey</option><option>Bath</option><option>Warehouse</option></select><select id="staff"><option>Yamada</option><option>Sato</option><option>Suzuki</option><option>Tanaka</option></select></div></header>
<main class="content">
<section id="home" class="section show"><div class="title">📢 Announcements</div><div id="ann"></div><button class="primary" onclick="addAnnForm()">＋ Add Announcement</button><div class="title" style="margin-top:25px">Quick Overview</div><div class="card">🔴 <b id="oc">0</b> items need ordering</div><div class="card">🟡 <b id="lc">0</b> items running low</div></section>
<section id="inv" class="section"><div class="title">📦 Inventory</div><div class="meta" id="where"></div><div class="tabs"><button class="tab active" onclick="cat='all';render()">All</button><button class="tab" onclick="cat='Ingredients';render()">Ingredients</button><button class="tab" onclick="cat='Supplies';render()">Supplies</button><button class="tab" onclick="cat='Order';render()">🔴 Order</button></div><input id="q" placeholder="🔎 Search items" oninput="render()"><div id="items"></div><button class="primary" onclick="addItemForm()">＋ Add Item</button></section>
<section id="orders" class="section"><div class="title">🛒 Orders</div><div id="orderlist"></div></section>
<section id="hist" class="section"><div class="title">📋 History</div><div id="history"></div></section>
<section id="more" class="section"><div class="title">⚙️ More</div><div class="card"><b>👤 Staff</b><div class="meta">Add names without individual accounts.</div><button class="primary" onclick="staffForm()">＋ Add Staff</button></div><div class="card"><b>🔄 Stock Transfer</b><div class="meta">Move stock between Sandymount, Dalkey, Bath and Warehouse.</div><button class="primary" onclick="transferForm()">＋ Record Transfer</button></div></section>
</main><nav class="bottom"><button class="nav active" onclick="show('home',this)">🏠<br>Home</button><button class="nav" onclick="show('inv',this)">📦<br>Inventory</button><button class="nav" onclick="show('orders',this)">🛒<br>Orders</button><button class="nav" onclick="show('hist',this)">📋<br>History</button><button class="nav" onclick="show('more',this)">⚙️<br>More</button></nav></div>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeM()">×</button><h3 id="mt"></h3><div id="mb"></div></div></div>
<script>
let data=[["Flour","Ingredients",18,10,25],["Butter","Ingredients",2,5,10],["Sugar","Ingredients",8,4,10],["Dry Yeast","Ingredients",6,3,10],["Eggs","Ingredients",24,20,60],["Small Paper Bags","Supplies",120,50,200],["Large Paper Bags","Supplies",18,30,100],["Cling Film","Supplies",3,2,6]];
let anns=[["🔴","Butter delivery","Butter delivery is delayed until Monday.","Manager"],["🟡","Closing reminder","Please check paper bags before closing.","Manager"]];
let logs=["14:32  Yamada  Butter  3 Unit → 2 Unit","13:58  Sato  Large Paper Bags  28 Unit → 18 Unit"];let cat="all";
const $=id=>document.getElementById(id), user=()=>$("staff").value, time=()=>new Date().toLocaleTimeString("en-IE",{hour:"2-digit",minute:"2-digit"});
function st(x){return x[2]<=0?["out","Out of stock"]:x[2]<=x[3]?["out","Order"]:x[2]<=x[3]*1.5?["low","Low"]:["ok","OK"]}
function render(){let q=($("q")?.value||"").toLowerCase(),a=data.filter(x=>(cat=="all"||x[1]==cat||(cat=="Order"&&x[2]<=x[3]))&&x[0].toLowerCase().includes(q));$("items").innerHTML=a.map(x=>{let s=st(x);return `<div class=card><div class=item><div><div class=name>${x[0]}</div><div class=meta>${x[1]} · Reorder at ${x[3]} Unit</div></div><div><div class=stock>${x[2]} Unit</div><span class="badge ${s[0]}">${s[1]}</span></div></div><div class=controls><button onclick="chg('${x[0]}',-1)">−1</button><button onclick="setq('${x[0]}')">Set quantity</button><button onclick="chg('${x[0]}',1)">＋1</button></div></div>`}).join("");$("where").textContent=$("loc").value;let o=data.filter(x=>x[2]<=x[3]).length,l=data.filter(x=>x[2]>x[3]&&x[2]<=x[3]*1.5).length;$("oc").textContent=o;$("lc").textContent=l;$("orderlist").innerHTML=o?data.filter(x=>x[2]<=x[3]).map(x=>`<div class=card><b>${x[0]}</b><div class=meta>${x[2]} Unit now · Order ${x[4]} Unit</div><button onclick="alert('Marked as ordered.')">Ordered</button></div>`).join(""):"<div class=meta>No items need ordering.</div>";$("ann").innerHTML=anns.map(a=>`<div class="notice ${a[0]=='🔴'?'important':'normal'}"><div class=head><b>${a[0]} ${a[1]}</b></div><div style="margin-top:8px">${a[2]}</div><div class=meta>Posted by ${a[3]}</div></div>`).join("");$("history").innerHTML=logs.map(x=>`<div class=card>${x}</div>`).join("")}
function chg(n,d){let x=data.find(x=>x[0]==n),old=x[2];x[2]=Math.max(0,x[2]+d);logs.unshift(`${time()}  ${user()}  ${n}  ${old} Unit → ${x[2]} Unit`);render()}
function setq(n){let x=data.find(x=>x[0]==n),v=prompt("Set quantity for "+n,x[2]);if(v===null)return;v=Number(v);if(isNaN(v)||v<0)return;let old=x[2];x[2]=v;logs.unshift(`${time()}  ${user()}  ${n}  ${old} Unit → ${v} Unit`);render()}
function show(id,el){document.querySelectorAll(".section").forEach(x=>x.classList.remove("show"));$(id).classList.add("show");document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));el.classList.add("active");render()}
function openM(t,b){$("mt").textContent=t;$("mb").innerHTML=b;$("modal").classList.add("show")}function closeM(){$("modal").classList.remove("show")}
function addItemForm(){openM("Add Item",`<label>Item name<input id=n placeholder="e.g. Milk"></label><label>Category<select id=c><option>Ingredients</option><option>Supplies</option></select></label><label>Current stock<input id=s type=number value=0></label><label>Reorder level<input id=m type=number value=5></label><label>Order quantity<input id=o type=number value=10></label><button class=primary onclick="addItem()">Add Item</button>`)}
function addItem(){let n=$("n").value.trim();if(!n)return;data.push([n,$("c").value,Number($("s").value),Number($("m").value),Number($("o").value)]);logs.unshift(`Item added  ${user()}  ${n}`);closeM();render()}
function addAnnForm(){openM("Add Announcement",`<label>Title<input id=at></label><label>Message<textarea id=ab></textarea></label><label>Priority<select id=al><option>Normal</option><option>Important</option></select></label><button class=primary onclick="addAnn()">Post Announcement</button>`)}
function addAnn(){let t=$("at").value.trim(),b=$("ab").value.trim();if(!t||!b)return;anns.unshift([$("al").value=="Important"?"🔴":"🟡",t,b,user()]);closeM();render()}
function staffForm(){openM("Add Staff",`<label>Staff name<input id=sn></label><button class=primary onclick="let n=$('sn').value.trim();if(n){let o=document.createElement('option');o.textContent=n;$('staff').appendChild(o);$('staff').value=n}closeM()">Add Staff</button>`)}
function transferForm(){openM("Record Stock Transfer",`<label>Item<select>${data.map(x=>`<option>${x[0]}</option>`).join("")}</select></label><label>From<select><option>Warehouse</option><option>Sandymount</option><option>Dalkey</option><option>Bath</option></select></label><label>To<select><option>Sandymount</option><option>Dalkey</option><option>Bath</option><option>Warehouse</option></select></label><label>Quantity<input type=number value=1></label><button class=primary onclick="alert('Transfer recorded in the live version.');closeM()">Record Transfer</button>`)}
$("loc").onchange=render;render();
</script></html>
